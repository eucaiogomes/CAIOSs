<!-- @dsCard group="Brand" viewport="700x240" name="Ambient backdrop" subtitle="Signature violet glow + faint grid (.juris-ambient)" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 0; min-height: 240px; }
  .center { position: relative; z-index: 1; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .h { font-family: var(--font-sans); font-weight: 500; font-size: 26px; letter-spacing: -0.02em; color: var(--text); }
  .s { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--juris-300); }
  .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(120px); }
  .orb-1 { width: 420px; height: 420px; top: -160px; right: -120px; background: radial-gradient(circle, rgba(124,58,237,0.10), transparent 72%); }
</style></head>
<body class="juris-ambient">
<div class="orb orb-1"></div>
<div class="center">
  <span class="s">.juris-ambient</span>
  <span class="h">Radial violet glow over ink-950, masked grid overlay</span>
</div>
</body></html>
