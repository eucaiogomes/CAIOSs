<!-- @dsCard group="Type" viewport="700x300" name="Sans · Geist" subtitle="UI workhorse — headings, body, buttons" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg); margin: 0; padding: 28px; color: var(--text); }
  .meta { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--juris-300); margin-bottom: 18px; }
  .spec { font-family: var(--font-sans); display: flex; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .spec:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 9px; color: var(--dim); width: 130px; flex-shrink: 0; }
  .h2 { font-size: 38px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; }
  .h3 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .bd { font-size: 15px; font-weight: 400; color: var(--ink-200); }
  .sm { font-size: 13.5px; font-weight: 400; color: var(--ink-400); }
</style></head>
<body>
<div class="meta">font-sans · Geist · 300/400/500/600/700</div>
<div class="spec"><span class="tag">H2 · 500 · clamp 46</span><span class="h2">Chegue antes da urgência</span></div>
<div class="spec"><span class="tag">H3 · 500 · 22</span><span class="h3">Painel DET — carteira</span></div>
<div class="spec"><span class="tag">Body · 400 · 15</span><span class="bd">Monitore o DET dos seus clientes e gere receita mensal.</span></div>
<div class="spec"><span class="tag">Small · 400 · 13.5</span><span class="sm">Notificação de fiscalização · Prazo de resposta: 10 dias úteis.</span></div>
</body></html>
