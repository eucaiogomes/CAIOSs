<!-- @dsCard group="Type" viewport="700x180" name="Mono · Geist Mono" subtitle="Eyebrows, kickers, status tags, data & timestamps" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg); margin: 0; padding: 28px; color: var(--text); }
  .meta { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--juris-300); margin-bottom: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
  .ey { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--juris-300); display: inline-flex; align-items: center; gap: 10px; }
  .ey::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--juris-300); }
  .pill { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 6px 11px; border-radius: var(--r-2); border: 1px solid var(--hairline-strong); background: var(--surface-2); }
  .data { font-family: var(--font-mono); font-size: 13px; color: var(--ink-200); }
  .ts { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
</style></head>
<body>
<div class="meta">font-mono · Geist Mono · 400/500/600</div>
<div class="row" style="margin-bottom:18px">
  <span class="ey">Como funciona</span>
  <span class="ey">Segurança</span>
</div>
<div class="row" style="margin-bottom:18px">
  <span class="pill">LGPD</span>
  <span class="pill">Monitoramento ativo</span>
  <span class="pill">Receita recorrente</span>
</div>
<div class="row">
  <span class="data">CNPJ 12.345.678/0001-90</span>
  <span class="ts">08:14 · hoje</span>
</div>
</body></html>
