<!-- @dsCard group="Spacing" viewport="700x200" name="Shadows & Glow" subtitle="Elevation + the signature violet glow" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg); margin: 0; padding: 30px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 100%; height: 76px; background: var(--surface-1); border: 1px solid var(--hairline-strong); border-radius: var(--r-5); }
  .nm { font-family: var(--font-mono); font-size: 9.5px; color: var(--text); }
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="nm">--shadow-md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="nm">--shadow-lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><span class="nm">--shadow-card</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--glow);border-color:var(--border-brand)"></div><span class="nm">--glow</span></div>
</div>
</body></html>
